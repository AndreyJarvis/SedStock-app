name: Build macOS app

on:
  workflow_dispatch:
  push:
    paths:
      - "SedStock.py"
      - "entitlements.plist"
      - "scripts/mac_sign_notarize.sh"
      - ".github/workflows/build-mac.yml"

jobs:
  # Основная сборка: x86_64 (Intel). Работает и на Intel, и на Apple Silicon (Rosetta).
  # Собираем на быстром ARM-раннере через Rosetta — не зависим от Intel-пула GitHub.
  build-intel:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rosetta
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - name: Install universal2 Python (в нём есть x86_64)
        run: |
          curl -Lo python.pkg https://www.python.org/ftp/python/3.12.7/python-3.12.7-macos11.pkg
          sudo installer -pkg python.pkg -target /

      - name: Build x86_64 .app (под Rosetta)
        run: |
          PY=/Library/Frameworks/Python.framework/Versions/3.12/bin/python3
          arch -x86_64 "$PY" -m pip install --upgrade pip
          arch -x86_64 "$PY" -m pip install pyinstaller customtkinter pillow openai requests moviepy imageio-ffmpeg pypdf
          git clone --depth 1 https://github.com/exiftool/exiftool.git exiftool_src
          mkdir -p mac_tools
          cp exiftool_src/exiftool mac_tools/exiftool
          cp -R exiftool_src/lib mac_tools/lib
          chmod +x mac_tools/exiftool
          arch -x86_64 "$PY" -m PyInstaller --windowed --noconfirm --name SedStock \
            --osx-bundle-identifier com.sedogin.sedstock \
            --add-data "mac_tools:tools" \
            --collect-all imageio_ffmpeg \
            --copy-metadata imageio \
            --copy-metadata imageio-ffmpeg \
            --copy-metadata moviepy \
            --collect-all customtkinter \
            SedStock.py

      # Проверяем, заданы ли секреты Apple. Если нет — просто соберём без подписи.
      - name: Detect signing secrets
        id: signing
        env:
          P12: ${{ secrets.MAC_CERT_P12_BASE64 }}
        run: |
          if [ -n "$P12" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Секреты Apple не заданы — собираю НЕПОДПИСАННОЕ приложение."
          fi

      - name: Sign & notarize
        if: steps.signing.outputs.enabled == 'true'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          AC_API_KEY_P8_BASE64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          chmod +x scripts/mac_sign_notarize.sh
          ./scripts/mac_sign_notarize.sh "dist/SedStock.app"

      - name: Zip the .app
        run: |
          cd dist
          zip -r -y "SedStock-macOS-Intel.zip" SedStock.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SedStock-macOS-Intel
          path: dist/SedStock-macOS-Intel.zip

  # Бонус: нативная сборка под Apple Silicon (M1/M2/M3) — быстрее для них, без Rosetta.
  build-arm:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter pillow openai requests moviepy imageio-ffmpeg pypdf

      - name: Get exiftool (standalone Perl)
        run: |
          git clone --depth 1 https://github.com/exiftool/exiftool.git exiftool_src
          mkdir -p mac_tools
          cp exiftool_src/exiftool mac_tools/exiftool
          cp -R exiftool_src/lib mac_tools/lib
          chmod +x mac_tools/exiftool

      - name: Build .app with PyInstaller
        run: |
          python -m PyInstaller --windowed --noconfirm --name SedStock \
            --osx-bundle-identifier com.sedogin.sedstock \
            --add-data "mac_tools:tools" \
            --collect-all imageio_ffmpeg \
            --copy-metadata imageio \
            --copy-metadata imageio-ffmpeg \
            --copy-metadata moviepy \
            --collect-all customtkinter \
            SedStock.py

      - name: Detect signing secrets
        id: signing
        env:
          P12: ${{ secrets.MAC_CERT_P12_BASE64 }}
        run: |
          if [ -n "$P12" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Секреты Apple не заданы — собираю НЕПОДПИСАННОЕ приложение."
          fi

      - name: Sign & notarize
        if: steps.signing.outputs.enabled == 'true'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          AC_API_KEY_P8_BASE64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          chmod +x scripts/mac_sign_notarize.sh
          ./scripts/mac_sign_notarize.sh "dist/SedStock.app"

      - name: Zip the .app
        run: |
          cd dist
          zip -r -y "SedStock-macOS-AppleSilicon.zip" SedStock.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SedStock-macOS-AppleSilicon
          path: dist/SedStock-macOS-AppleSilicon.zip
