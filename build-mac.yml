name: Build macOS app

# Запуск: автоматически при заливке SedStock.py, и вручную кнопкой (Run workflow)
on:
  workflow_dispatch:
  push:
    paths:
      - "SedStock.py"
      - ".github/workflows/build-mac.yml"

jobs:
  build-macos:
    runs-on: macos-13          # Intel-раннер -> x86_64 .app (идёт и на Apple Silicon через Rosetta)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter pillow openai requests moviepy imageio-ffmpeg pypdf

      - name: Get exiftool (standalone Perl — работает на маке без установки)
        run: |
          git clone --depth 1 https://github.com/exiftool/exiftool.git exiftool_src
          mkdir -p mac_tools
          cp exiftool_src/exiftool mac_tools/exiftool
          cp -R exiftool_src/lib mac_tools/lib
          chmod +x mac_tools/exiftool

      - name: Build .app with PyInstaller
        run: |
          python -m PyInstaller --windowed --noconfirm \
            --name SedStock \
            --add-data "mac_tools:tools" \
            --collect-all imageio_ffmpeg \
            --copy-metadata imageio \
            --copy-metadata imageio-ffmpeg \
            --copy-metadata moviepy \
            --collect-all customtkinter \
            SedStock.py

      - name: Zip the .app
        run: |
          cd dist
          zip -r -y SedStock-macOS.zip SedStock.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SedStock-macOS
          path: dist/SedStock-macOS.zip
